{% extends "base.html" %}
{% block title %}Ingresar · Junta de Vecinos N.° 2{% endblock %}
{% block content %}
<div class="container my-5" style="max-width: 480px;">
  <h1 class="section-title">Ingresar</h1>
  <form method="post" class="caja">
    <div class="mb-3">
      <label class="form-label" for="usuario">Usuario</label>
      <input class="form-control" type="text" id="usuario" name="usuario" autocomplete="username" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="clave">Clave</label>
      <input class="form-control" type="password" id="clave" name="clave" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary btn-lg w-100" type="submit">Entrar</button>
  </form>
  <p class="mt-3 text-center">
    ¿Eres vecino o vecina y no tienes cuenta?
    <a href="{{ url_for('registro') }}">Crear una cuenta</a>
  </p>
</div>
{% endblock %}

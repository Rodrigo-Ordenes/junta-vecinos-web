{% extends "base.html" %}
{% block title %}Contacto · Junta de Vecinos N.° 2{% endblock %}
{% block content %}
<section class="container my-5" style="max-width: 700px;">
  <h1 class="section-title">Contacto</h1>
  <p class="text-muted">¿Tienes una consulta, sugerencia o quieres participar? Escríbenos.</p>

  <form method="POST" class="form-contacto mt-4">
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre completo</label>
      <input type="text" class="form-control" id="nombre" name="nombre" required>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Correo electrónico</label>
      <input type="email" class="form-control" id="email" name="email" required>
    </div>
    <div class="mb-3">
      <label for="telefono" class="form-label">Teléfono (opcional)</label>
      <input type="tel" class="form-control" id="telefono" name="telefono">
    </div>
    <div class="mb-3">
      <label for="mensaje" class="form-label">Mensaje</label>
      <textarea class="form-control" id="mensaje" name="mensaje" rows="5" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Enviar mensaje</button>
  </form>
</section>
{% endblock %}

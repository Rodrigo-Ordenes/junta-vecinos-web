{% extends "panel/_base_panel.html" %}
{% block title %}Editar reserva · Panel{% endblock %}
{% block panel %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h1 class="section-title mb-0 h3">Editar reserva de la sede</h1>
  <a class="btn btn-outline-secondary" href="{{ url_for('panel_reservas') }}">&larr; Volver a reservas</a>
</div>

<form method="post" class="row g-3 caja">
  <div class="col-md-4">
    <label class="form-label" for="fecha">Fecha <span class="obligatorio">*</span></label>
    <input class="form-control" type="date" id="fecha" name="fecha" value="{{ reserva.fecha }}" required>
  </div>
  <div class="col-md-4">
    <label class="form-label" for="hora_inicio">Hora de inicio <span class="obligatorio">*</span></label>
    <input class="form-control" type="time" id="hora_inicio" name="hora_inicio" value="{{ reserva.hora_inicio }}" required>
  </div>
  <div class="col-md-4">
    <label class="form-label" for="hora_fin">Hora de término <span class="obligatorio">*</span></label>
    <input class="form-control" type="time" id="hora_fin" name="hora_fin" value="{{ reserva.hora_fin }}" required>
  </div>

  <div class="col-md-6">
    <label class="form-label" for="actividad">Actividad <span class="obligatorio">*</span></label>
    <input class="form-control" type="text" id="actividad" name="actividad" value="{{ reserva.actividad }}" required>
  </div>
  <div class="col-md-6">
    <label class="form-label" for="estado">Estado de la reserva <span class="obligatorio">*</span></label>
    <select class="form-select" id="estado" name="estado" required>
      {% for e in estados %}
        <option value="{{ e }}" {% if reserva.estado == e %}selected{% endif %}>{{ e }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="col-md-6">
    <label class="form-label" for="solicitante">Nombre de la vecina o vecino <span class="obligatorio">*</span></label>
    <input class="form-control" type="text" id="solicitante" name="solicitante" value="{{ reserva.solicitante }}" required>
  </div>
  <div class="col-md-3">
    <label class="form-label" for="telefono">Teléfono</label>
    <input class="form-control" type="tel" id="telefono" name="telefono" value="{{ reserva.telefono or '' }}" placeholder="+569XXXXXXXX">
  </div>
  <div class="col-md-3">
    <label class="form-label" for="personas">N.° de personas</label>
    <input class="form-control" type="number" min="1" id="personas" name="personas" value="{{ reserva.personas or '' }}">
  </div>

  <div class="col-12">
    <label class="form-label" for="email">Correo electrónico</label>
    <input class="form-control" type="email" id="email" name="email" value="{{ reserva.email or '' }}">
  </div>

  <div class="col-12">
    <label class="form-label" for="observacion">Observación o nota interna</label>
    <textarea class="form-control" id="observacion" name="observacion" rows="3">{{ reserva.observacion or '' }}</textarea>
  </div>

  <div class="col-12 d-flex flex-wrap gap-2 justify-content-between align-items-center mt-3">
    <div class="d-flex gap-2">
      <button class="btn btn-primary btn-lg" type="submit">Guardar cambios</button>
      <a class="btn btn-outline-secondary btn-lg" href="{{ url_for('panel_reservas') }}">Cancelar</a>
    </div>
  </div>
</form>

<div class="caja mt-4 border-danger">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
    <div>
      <h2 class="h6 mb-0 text-danger">Eliminar esta reserva</h2>
      <p class="small text-muted mb-0">Esta acción liberará el horario en la sede de forma inmediata.</p>
    </div>
    <form method="post" action="{{ url_for('panel_reserva_eliminar', reserva_id=reserva.id) }}"
          onsubmit="return confirm('¿Seguro que deseas eliminar definitivamente esta reserva?');">
      <button class="btn btn-outline-danger" type="submit">Eliminar definitivamente</button>
    </form>
  </div>
</div>
{% endblock %}

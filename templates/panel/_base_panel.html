{% extends "base.html" %}
{% block content %}
<div class="container my-4">
  <div class="row g-4">
    <aside class="col-lg-3">
      <div class="caja">
        <h2 class="h6 text-uppercase text-muted">Panel</h2>
        <p class="small mb-2">{{ usuario.nombre }}<br><strong>{{ usuario.rol|capitalize }}</strong></p>
        <div class="list-group panel-menu">
          <a class="list-group-item list-group-item-action" href="{{ url_for('panel') }}">🏠 Inicio del panel</a>
          {% for clave, etiqueta, icono in menu_panel %}
            {% if puede(clave) %}
              <a class="list-group-item list-group-item-action" href="{{ url_panel(clave) }}">
                {{ icono }} {{ etiqueta }}
              </a>
            {% endif %}
          {% endfor %}
        </div>
      </div>
    </aside>
    <section class="col-lg-9">
      {% block panel %}{% endblock %}
    </section>
  </div>
</div>
{% endblock %}
